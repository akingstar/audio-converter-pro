name: Audio Conversion Browser Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audio-conversion-test.yml'

permissions:
  contents: read

jobs:
  conversion-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run real audio conversion
        run: |
          cat > test.cjs <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");

          function makeWav() {
            const rate = 44100;
            const seconds = 2;
            const samples = rate * seconds;
            const dataSize = samples * 2;
            const b = Buffer.alloc(44 + dataSize);
            b.write("RIFF", 0);
            b.writeUInt32LE(36 + dataSize, 4);
            b.write("WAVE", 8);
            b.write("fmt ", 12);
            b.writeUInt32LE(16, 16);
            b.writeUInt16LE(1, 20);
            b.writeUInt16LE(1, 22);
            b.writeUInt32LE(rate, 24);
            b.writeUInt32LE(rate * 2, 28);
            b.writeUInt16LE(2, 32);
            b.writeUInt16LE(16, 34);
            b.write("data", 36);
            b.writeUInt32LE(dataSize, 40);
            for (let i = 0; i < samples; i++) {
              b.writeInt16LE(Math.sin(2 * Math.PI * 440 * i / rate) * 12000, 44 + i * 2);
            }
            return b;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
            const page = await browser.newPage({ acceptDownloads: true });
            page.on("pageerror", e => console.log("PAGE ERROR:", e.message));
            page.on("console", m => {
              if (m.type() === "error") console.log("BROWSER ERROR:", m.text());
            });

            try {
              await page.goto("https://akingstar.github.io/audio-converter-pro/", { waitUntil: "domcontentloaded", timeout: 90000 });
              await page.locator("#fileInput").setInputFiles({
                name: "test-tone.wav",
                mimeType: "audio/wav",
                buffer: makeWav()
              });
              await page.locator("#format").selectOption("wav");
              await page.locator("#sampleRate").selectOption("48000");
              await page.locator("#channels").selectOption("1");
              await page.locator("#convertBtn").click();

              await page.waitForFunction(() => {
                const s = document.querySelector("#status")?.textContent || "";
                return s.startsWith("Finished:") || s.startsWith("Engine loading failed:");
              }, { timeout: 240000 });

              const status = await page.locator("#status").innerText();
              console.log("CONVERSION STATUS:", status);

              if (status !== "Finished: 1 successful, 0 failed.") {
                throw new Error("Conversion did not succeed: " + status);
              }

              const downloadPromise = page.waitForEvent("download");
              await page.locator('#fileList a[download]').click();
              const download = await downloadPromise;
              const output = "/tmp/audio-converted.wav";
              await download.saveAs(output);

              const size = fs.statSync(output).size;
              console.log("OUTPUT FILE:", download.suggestedFilename());
              console.log("OUTPUT SIZE:", size, "bytes");

              if (!download.suggestedFilename().endsWith(".wav") || size <= 44) {
                throw new Error("Output file verification failed");
              }

              console.log("RESULT: PASS - REAL AUDIO CONVERSION VERIFIED");
            } finally {
              await browser.close();
            }
          })().catch(e => {
            console.error("TEST FAILED:", e);
            process.exit(1);
          });
          NODE
          node test.cjs
